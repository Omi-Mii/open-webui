<script>
(function(){
  const EXPECTED_HASH="4bbae0b0f8728870c030cff3681b92ef1ef4941f265b1ae365e2b79a6a503b21";
  const KEY="ehimeTripAccess";
  const gate=document.getElementById("authGate");
  const input=document.getElementById("authPassword");
  const submit=document.getElementById("authSubmit");
  const error=document.getElementById("authError");
  document.documentElement.classList.add("auth-lock");

  function unlock(){
    try{sessionStorage.setItem(KEY,"1")}catch(e){}
    gate.remove();
    document.documentElement.classList.remove("auth-lock");
    window.dispatchEvent(new Event("resize"));
  }
  async function sha256(text){
    const data=new TextEncoder().encode(text);
    const digest=await crypto.subtle.digest("SHA-256",data);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  async function check(){
    error.textContent="";
    submit.disabled=true;
    try{
      const h=await sha256(input.value);
      if(h===EXPECTED_HASH){unlock()}
      else{error.textContent="パスワードが違います。";input.select()}
    }catch(e){
      error.textContent="確認処理に失敗しました。Safariで開き直してください。";
    }finally{submit.disabled=false}
  }
  try{
    if(sessionStorage.getItem(KEY)==="1"){unlock();return}
  }catch(e){}
  submit.addEventListener("click",check);
  input.addEventListener("keydown",e=>{if(e.key==="Enter")check()});
  setTimeout(()=>input.focus(),50);
})();
</script>

function drawAreas(){if(!map)return;circles.clearLayers();keys().forEach(k=>{const a=AREAS[k],color=selected==='all'?(k==='city'||k==='jr'?'#638d79':DAYS[a.days[0]-1].color):day().color;L.circle(a.c,{radius:a.r,color,weight:1.5,opacity:.65,fillColor:color,fillOpacity:.09,interactive:false}).addTo(circles)})}
function groupsByScreen(items,gap){const groups=[];items.forEach(item=>{const pt=map.latLngToContainerPoint(item.c);let g=groups.find(x=>Math.abs(pt.x-x.pt.x)<gap&&Math.abs(pt.y-x.pt.y)<38);if(g)g.items.push(item);else groups.push({pt,items:[item]})});return groups}
function renderPins(){if(!map)return;markers.clearLayers();if(selected==='all'){const its=keys().map(k=>({k,c:AREAS[k].c}));groupsByScreen(its,112).forEach(g=>{const first=g.items[0],a=AREAS[first.k],multi=g.items.length>1,label=multi?(g.items.every(x=>['zoo','tobe'].includes(x.k))?'砥部':g.items.every(x=>['port','island','mitsu'].includes(x.k))?'興居島・三津浜':'松山周辺')+' '+g.items.length+'エリア':a.name;const mk=L.marker(first.c,{icon:L.divIcon({className:'',html:'<div class="areapin" style="--p:#638d79">'+esc(label)+'<small>'+(multi?'タップして拡大':a.days.map(i=>DAYS[i-1].date).join('・'))+'</small></div>',iconSize:[128,46],iconAnchor:[64,23]}),title:label}).addTo(markers);mk.on('click',()=>{if(multi){map.fitBounds(g.items.map(x=>x.c),{padding:[70,75],maxZoom:14,animate:false})}else{areaFocus=first.k;renderAreaTabs();fit();showArea(first.k)}})});return}const d=day(),unique={};d.plan.forEach((e,i)=>{if(!unique[e[1]])unique[e[1]]={k:e[1],c:PLACES[e[1]].c,nums:[],indices:[]};unique[e[1]].nums.push(i+1);unique[e[1]].indices.push(i)});groupsByScreen(Object.values(unique),44).forEach(g=>{const first=g.items[0],multi=g.items.length>1,nums=g.items.flatMap(x=>x.nums).sort((a,b)=>a-b),label=multi?nums[0]+'＋':nums.join('·'),mk=L.marker(first.c,{icon:L.divIcon({className:'',html:'<div class="pin '+(label.length>2?'multi':'')+'" style="--p:'+d.color+'">'+label+'</div>',iconSize:[38,35],iconAnchor:[19,17]}),title:g.items.map(x=>PLACES[x.k].name).join('・')}).addTo(markers);mk.on('click',()=>{if(multi){map.fitBounds(g.items.map(x=>x.c),{padding:[85,85],maxZoom:17,animate:false})}else showPlace(first.k,first.indices[0])});if(!multi&&map.getZoom()>=13)mk.bindTooltip(PLACES[first.k].name,{direction:'top',className:'pinlabel',offset:[0,-16]})})}
function showDialog(title,kind,body){lastFocus=document.activeElement;$('#dialogHeading').innerHTML='<div class="status">'+esc(kind)+'</div><h2 id="dialogTitle">'+esc(title)+'</h2>';$('#dialogBody').innerHTML=body;$('#modal').hidden=false;$('#close').focus()}
function showPlace(id,index){const p=PLACES[id],d=day();let visits=[];if(d)d.plan.forEach((e,i)=>{if(e[1]===id)visits.push([e,i])});let actions='';visits.forEach(([e,i])=>{const next=d.plan[i+1];if(next&&next[1]!==id)actions+='<div class="infocard"><strong style="font-size:12px">'+(i+1)+'番目・'+e[0]+'の次</strong><p>'+esc(e[3]||'移動')+' → '+esc(PLACES[next[1]].name)+'</p><div class="links"><a class="primary" href="'+directionURL(id,next[1],e[4])+'" target="_blank" rel="noopener noreferrer">場所名で経路を開く ↗</a></div></div>'});showDialog(p.name,p.kind, (visits.length?'<div class="hint">'+visits.map(([e,i])=>'予定 '+(i+1)+'：'+e[0]+' ／ '+esc(e[2])).join('<br>')+'</div>':'')+'<p>'+esc(p.about)+'</p><dl><dt>営業時間・料金など</dt><dd>'+esc(p.hours)+'</dd><dt>知っておくこと</dt><dd>'+esc(p.tip)+'</dd></dl><div class="links"><a class="primary" href="'+placeURL(id)+'" target="_blank" rel="noopener noreferrer">Googleマップでこの場所を見る ↗</a></div>'+actions+'<h3 style="font-size:13px;margin-top:18px">関連情報・出典</h3><div class="links">'+p.sources.map(sourceLink).join('')+'</div><p class="small">施設情報の確認日：2026/9/20。予定時刻・予約内容とは区別して表示しています。</p>')}
function showArea(k){const a=AREAS[k];showDialog(a.name,'散策するエリアの目安','<p>この着色は周辺で過ごす範囲の目安です。道路に沿った経路や施設の敷地ではありません。</p><div class="links">'+a.days.map(i=>'<button data-select-day="'+i+'">'+DAYS[i-1].date+'の訪問順を見る</button>').join('')+'</div>')}
function closeDialog(){$('#modal').hidden=true;if(lastFocus)lastFocus.focus()}
function sharing(){showDialog('限定共有について','現在：公開版・ログイン制限なし','<div class="noticebar">現在のURLは公開リポジトリから配信しています。指定した人だけに制限した地図ではありません。</div><p>リンクを特定の人だけに送っても、転送された相手は閲覧できます。「検索に出さない」指定も閲覧制限ではありません。</p><p><strong>指定した人だけに限定する場合</strong><br>公開元を非公開にし、許可したメールアドレスで認証する配信先へ移す必要があります。例としてCloudflare Accessのメール認証があります。</p><p>共通パスワード方式もありますが、パスワードを転送されると他の人も開けます。このページにはどちらの制限もまだ設定していません。</p><p class="small">既存の公開版・Git履歴・配信先のキャッシュは別途取り扱いが必要です。公開リポジトリ全体の設定は変更していません。</p>')}
$('.daytabs').innerHTML='<button class="daytab" role="tab" data-day="all" aria-selected="true">全体<small>エリア</small></button>'+DAYS.map(d=>'<button class="daytab" role="tab" data-day="'+d.id+'" aria-selected="false">'+d.date+'<small>'+d.short+'</small></button>').join('');
document.addEventListener('click',e=>{const d=e.target.closest('[data-day]'),a=e.target.closest('[data-area]'),s=e.target.closest('[data-select-day]'),p=e.target.closest('[data-place]'),v=e.target.closest('[data-view]');if(d)selectDay(d.dataset.day);else if(a){areaFocus=a.dataset.area||null;renderAreaTabs();fit()}else if(s){closeDialog();selectDay(s.dataset.selectDay);openSheet(true)}else if(p)showPlace(p.dataset.place,Number(p.dataset.index));else if(v){view=v.dataset.view;renderBody();openSheet(true)}});
$('#toggle').onclick=$('#expand').onclick=()=>openSheet(!$('#sheet').classList.contains('open'));$('#fit').onclick=()=>{areaFocus=null;renderAreaTabs();fit()};$('#plus').onclick=()=>{if(map)map.zoomIn()};$('#minus').onclick=()=>{if(map)map.zoomOut()};$('#shareInfo').onclick=sharing;$('#close').onclick=closeDialog;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.key==='Tab'&&!$('#modal').hidden){const f=[...$('.dialog').querySelectorAll('a[href],button')],first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function initMap(){if(map||!window.L)return;try{map=L.map('map',{zoomControl:false,minZoom:9,maxZoom:18,zoomSnap:.5}).setView([33.82,132.74],11);circles=L.layerGroup().addTo(map);markers=L.layerGroup().addTo(map);let loaded=0;const tile=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxNativeZoom:18,maxZoom:18,minZoom:9,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>'}).addTo(map);tile.on('tileload',()=>{loaded++;$('#loadnote').hidden=true});setTimeout(()=>{if(!loaded){$('#loadnote').hidden=false;$('#loadnote').textContent='背景地図を取得できません。通信状態を確認して再読み込みしてください。下の予定と場所名リンクは利用できます。'}},12000);map.on('zoomend',renderPins);new ResizeObserver(()=>map.invalidateSize()).observe($('.mapwrap'));L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);selectDay(selected)}catch(err){$('#loadnote').textContent='地図の開始に失敗しました。下の予定・場所情報は利用できます。';console.error(err)}}
function loadScript(url,fail){const s=document.createElement('script');s.src=url;s.onload=initMap;s.onerror=fail;document.head.appendChild(s)}
selectDay('all');
loadScript('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',()=>{const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',()=>{$('#loadnote').textContent='地図プログラムを読み込めません。通信状態を確認してください。予定とGoogleマップの場所リンクは下から開けます。';openSheet(true)})});
</script>
